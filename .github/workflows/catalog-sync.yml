name: Catalog sync

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    if: ${{ secrets.SITE_SYNC_URL != '' && secrets.CRON_SECRET != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync rates, full Korean catalog and retention
        env:
          SITE_SYNC_URL: ${{ secrets.SITE_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail --show-error --silent --retry 3
          --request POST
          --header "Authorization: Bearer ${CRON_SECRET}"
          "${SITE_SYNC_URL%/}/api/internal/sync"
