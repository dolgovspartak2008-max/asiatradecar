name: Catalog sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Complete daily Japan catalog sync
        env:
          SITE_SYNC_URL: ${{ secrets.SITE_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_SYNC_URL or CRON_SECRET is not configured; Vercel Cron remains primary."
            exit 0
          fi
          for attempt in $(seq 1 12); do
            response=$(curl --fail --show-error --silent --retry 3 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${SITE_SYNC_URL%/}/api/internal/sync?scope=japan")
            completed=$(printf '%s' "$response" | jq -r '.japan.value.completed // false')
            if [ "$completed" = "true" ]; then
              exit 0
            fi
          done
          echo "Japan catalog sync did not finish after 12 resumable runs."
          exit 1
