name: Catalog sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync rates and rolling 24-hour catalogs
        env:
          SITE_SYNC_URL: ${{ secrets.SITE_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_SYNC_URL or CRON_SECRET is not configured; Vercel Cron remains primary."
            exit 0
          fi
          curl --fail --show-error --silent --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_SYNC_URL%/}/api/internal/sync"
